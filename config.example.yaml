# IANA timezone name, e.g. "Asia/Taipei", "America/New_York", "Europe/Berlin".
# Leave empty to use the system timezone. Affects timestamps, memory filenames
# and journal dates.
timezone: ""

llm:
  active_profile: "local-gateway"
  maxContextTokens: 150000
  memoryCharLimit: 3000
  profiles:
    local-gateway:
      protocol: "openai_chat_completions" # openai_chat_completions | openai_responses
      baseUrl: "${LLM_BASE_URL}"          # e.g. http://localhost:8317/v1 or http://localhost:11434/v1
      apiKey: "${LLM_API_KEY}"            # ignored when auth is none
      auth: "bearer"                       # bearer | none
      model: "claude-sonnet-4-6"           # any model ID exposed by the configured gateway
      reasoningEffort: "default"           # default | none | auto | minimal | low | medium | high | xhigh
      tokenLimitField: "max_completion_tokens" # max_completion_tokens | max_tokens
      capabilities:
        vision: true
        function_tools: true
        responses: true
        hosted_web_search: true
        hosted_image_generation: true
        hosted_code_execution: false

    # Example local gateway without authentication. Enable only on a trusted endpoint.
    # ollama:
    #   protocol: "openai_chat_completions"
    #   baseUrl: "http://localhost:11434/v1"
    #   apiKey: ""
    #   auth: "none"
    #   model: "qwen3:8b"
    #   reasoningEffort: "default"
    #   tokenLimitField: "max_tokens"
    #   capabilities:
    #     vision: false
    #     function_tools: true
    #     responses: false
    #     hosted_web_search: false
    #     hosted_image_generation: false
    #     hosted_code_execution: false

discord:
  enabled: false                        # set true to run discord bot
  token: "${DISCORD_TOKEN}"             # bot token from Discord Developer Portal
  allowed_channels: []                  # `umiro onbord` can set the first allowed channel
  ambient_channels: []                  # channel IDs where the bot replies without being @mentioned (threads do not inherit)
  ignored_channels: []                  # channel/thread IDs to fully ignore: no trigger and no recording, even on mention/reply/DM/ambient (threads do not inherit)
  allowed_guilds: []                    # Empty means all guilds; set IDs manually if needed
  owner_id: ""                          # set locally by `umiro onbord`
  respond_to_bots: false                # whether to process messages from other bots
  status: "online"                      # online | idle | dnd | invisible
  activity: "Burrowing around…🦦✨"    # custom activity text

journal:
  enabled: false                        # auto-write a daily journal at scheduled time
  hour: 22                              # 0-23
  minute: 0                             # 0-59
  model: ""                              # dedicated journal model; empty = active profile default

soul_guardian:                           # file integrity monitor
  enabled: false                        # enable the gateway's built-in integrity scheduler.
                                        # When on, the gateway runs deterministic checks itself
                                        # and sends drift alerts directly — no LLM decides
                                        # whether to check or notify.
  schedule: "0 8,20 * * *"              # node-cron expression driving the built-in scheduler.
  timezone: ""                          # IANA timezone for the schedule. Empty = global timezone.
  channel_id: ""                        # Discord channel/thread ID for drift alerts.
                                        # Empty = never notify (safe default).
  targets:                              # files to monitor (paths relative to workspace/)
    - path: SOUL.md
      mode: alert                       # restore = auto-revert, alert = warn only, ignore = skip
    - path: OWNER.md
      mode: alert
    - path: MEMORY.md
      mode: alert
    - path: AGENT.md
      mode: alert
    - path: JOURNAL.md
      mode: alert
    - path: PEOPLE.md
      mode: alert
    - path: config/crons.json
      mode: alert

prompt:
  peopleInlineLimit: 1500               # inline PEOPLE.md into the system prompt while it is
                                        # under this many characters; beyond that only a pointer
                                        # is included and the agent reads the file on demand.
                                        # 0 = never inline.

tools:
  bash_owner_only: true                 # bash runs arbitrary shell commands with no sandbox.
                                        # Setting this to false lets ANY user who can mention
                                        # the bot execute commands on your machine.
  bash_allowed_users: []                # Discord user IDs allowed to run bash even when
                                        # bash_owner_only is true (bash only; other owner-only
                                        # tools still blocked).
  exposure:                             # Tool exposure grading (visibility, not permission).
    enabled: false                      # false = send every tool's full schema each turn
                                        # (legacy). true = only native + matched tools carry
                                        # schema; the rest are reached via tool_catalog.
    max_matched_tools: 12               # cap on match-level tools exposed per turn (1-50).

image_generation:
  identity_reference_path: ""           # optional canonical face/identity image under
                                        # workspace/attachments/; the agent sends it only
                                        # when image_gen uses use_identity_reference=true.

# Background analysis of image/document attachments (OCR always runs; this block is the
# visual-description half). Off by default: a vision model the configured endpoint does not
# serve fails on every call, and because this runs in a background job the failure is silent.
attachment_analysis:
  enabled: false
  # Uses the active profile protocol and model; there is no separate model override.
  base_url: ""                            # "" = inherit active profile baseUrl
  api_key_env: ""                         # ENV VAR NAME holding the key; "" = inherit active profile apiKey
  language: ""                            # e.g. "Traditional Chinese"; "" = model decides
  concurrency: 2                          # max simultaneous attachment jobs
  daily_budget: 0                         # successful descriptions per day; 0 = unlimited
  timeout_ms: 60000
  max_image_bytes: 20971520               # larger images skip vision; OCR still runs
  max_output_tokens: 1200

skills: []                              # enabled skill names (must exist in workspace/skills/<name>/)

plugins: []                             # plugin modules loaded from local paths. Managed entries are
                                        # written here by `umiro plugin install`; manual entries also work.
                                        # Each entry: { path: <abs or relative-to-root>, enabled: true }.
                                        # A plugin exports a manifest plus optional tools, schedules, and
                                        # event handlers. Schedules follow plugin startup/shutdown and are
                                        # not written to crons.json. Plugin tools default to owner-only.
                                        # A load failure is logged and skipped, never crashing the gateway.
                                        # Do NOT put private connection data here — the plugin
                                        # module reads its own secrets from .env / its own config.
                                        # Example:
                                        #   - path: ../umiro-plugins/example-plugin/index.ts
                                        #     enabled: true
