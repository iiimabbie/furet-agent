# IANA timezone name, e.g. "Asia/Taipei", "America/New_York", "Europe/Berlin".
# Leave empty to use the system timezone. Affects timestamps, memory filenames
# and journal dates.
timezone: ""

llm:
  api_key: "${LLM_API_KEY}"             # required
  base_url: "${LLM_BASE_URL}"           # required (OpenAI-compatible endpoint)
  currentModel: "claude-sonnet-4-6"
  reasoningEffort: "default"            # default | none | auto | minimal | low | medium | high | xhigh
  codingModel: "claude-opus-4-6"        # model used by self_evolve tool
  maxContextTokens: 150000              # token budget for conversation context
  memoryCharLimit: 3000                 # MEMORY.md character limit
  modelList:
    - claude-opus-4-6
    - claude-sonnet-4-6
    - claude-haiku-4-5-20251001

discord:
  enabled: false                        # set true to run discord bot
  token: "${DISCORD_TOKEN}"             # bot token from Discord Developer Portal
  allowed_channels: []                  # `furet onbord` can set the first allowed channel
  ambient_channels: []                  # channel IDs where the bot replies without being @mentioned (threads do not inherit)
  allowed_guilds: []                    # Empty means all guilds; set IDs manually if needed
  owner_id: ""                          # set locally by `furet onbord`
  respond_to_bots: false                # whether to process messages from other bots
  status: "online"                      # online | idle | dnd | invisible
  activity: "Burrowing around…🦦✨"    # custom activity text

journal:
  enabled: false                        # auto-write a daily journal at scheduled time
  hour: 22                              # 0-23
  minute: 0                             # 0-59

soul_guardian:                           # file integrity monitor
  targets:                              # files to monitor (paths relative to workspace/)
    - path: SOUL.md
      mode: alert                       # restore = auto-revert, alert = warn only, ignore = skip
    - path: OWNER.md
      mode: alert
    - path: MEMORY.md
      mode: alert
    - path: AGENT.md
      mode: alert
    - path: JOURNAL.md
      mode: alert
    - path: PEOPLE.md
      mode: alert
    - path: config/crons.json
      mode: alert

prompt:
  peopleInlineLimit: 1500               # inline PEOPLE.md into the system prompt while it is
                                        # under this many characters; beyond that only a pointer
                                        # is included and the agent reads the file on demand.
                                        # 0 = never inline.

tools:
  bash_owner_only: true                 # bash runs arbitrary shell commands with no sandbox.
                                        # Setting this to false lets ANY user who can mention
                                        # the bot execute commands on your machine.
  bash_allowed_users: []                # Discord user IDs allowed to run bash even when
                                        # bash_owner_only is true (bash only; other owner-only
                                        # tools still blocked).
  exposure:                             # Tool exposure grading (visibility, not permission).
    enabled: false                      # false = send every tool's full schema each turn
                                        # (legacy). true = only native + matched tools carry
                                        # schema; the rest are reached via tool_catalog.
    max_matched_tools: 12               # cap on match-level tools exposed per turn (1-50).

image_generation:
  identity_reference_path: ""           # optional canonical face/identity image under
                                        # workspace/attachments/; the agent sends it only
                                        # when image_gen uses use_identity_reference=true.

skills: []                              # enabled skill names (must exist in workspace/skills/<name>/)

plugins: []                             # private plugin modules loaded from local paths.
                                        # Each entry: { path: <abs or relative-to-root>, enabled: true }.
                                        # A plugin exports a manifest plus optional tools, schedules, and
                                        # event handlers. Schedules follow plugin startup/shutdown and are
                                        # not written to crons.json. Plugin tools default to owner-only.
                                        # A load failure is logged and skipped, never crashing the gateway.
                                        # Do NOT put private connection data here — the plugin
                                        # module reads its own secrets from .env / its own config.
                                        # Example:
                                        #   - path: ../furet-plugins/livly-mumu/index.ts
                                        #     enabled: true
